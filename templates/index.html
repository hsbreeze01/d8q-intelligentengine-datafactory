<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#001529"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/static/images/icon-192.png">
<title>D8Q 智能资讯平台</title>
<script src="/static/vendor/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f0f2f5;color:#333;display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;background:#001529;color:rgba(255,255,255,.65);display:flex;flex-direction:column;flex-shrink:0}
.sidebar .logo{padding:16px 20px;font-size:18px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar .logo span{font-size:11px;opacity:.5;font-weight:400;margin-left:4px}
.sidebar nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:12px 20px;color:rgba(255,255,255,.65);text-decoration:none;font-size:14px;border-left:3px solid transparent;transition:all .15s}
.sidebar nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
.sidebar nav a.active{color:#fff;background:rgba(24,144,255,.15);border-left-color:#1890ff}
.sidebar .divider{height:1px;background:rgba(255,255,255,.08);margin:8px 16px}
.sidebar .user-box{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.sidebar .user-box .name{color:#fff;font-size:13px;font-weight:500}
.sidebar .user-box .role{color:rgba(255,255,255,.45);margin-top:2px}
.sidebar .user-box .logout{color:#ff6b6b;cursor:pointer;margin-top:4px;font-size:11px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:48px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.topbar .title{font-size:16px;font-weight:600}
.topbar .search{padding:6px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:220px;outline:none}
.topbar .search:focus{border-color:#1890ff}
.content{flex:1;overflow-y:auto;padding:24px}
.page{display:none}.page.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.mc{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mc .label{font-size:13px;color:#999;margin-bottom:8px}
.mc .value{font-size:28px;font-weight:700;color:#1890ff}
.mc .sub{font-size:12px;margin-top:4px}.mc .sub.up{color:#52c41a}.mc .sub.warn{color:#faad14}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.card h3 .more{font-size:12px;color:#1890ff;font-weight:400;cursor:pointer;text-decoration:none}
.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.ni{padding:12px 0;border-bottom:1px solid #f5f5f5}.ni:last-child{border-bottom:none}
.ni .t{font-size:14px;font-weight:500;margin-bottom:4px}
.ni .m{font-size:12px;color:#999}
.ni .s{font-size:13px;color:#666;margin-top:4px;line-height:1.6}
.ni .acts{margin-top:6px;display:flex;gap:12px}.ni .acts a{font-size:12px;color:#1890ff;cursor:pointer;text-decoration:none}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;margin-right:4px}
.tag-policy{background:#fff7e6;color:#fa8c16}.tag-tech{background:#e6f7ff;color:#1890ff}
.tag-funding{background:#f6ffed;color:#52c41a}.tag-market{background:#f9f0ff;color:#722ed1}.tag-report{background:#f0f0f0;color:#666}
.et{width:100%;border-collapse:collapse;font-size:13px}
.et th{text-align:left;padding:10px 12px;background:#fafafa;color:#666;font-weight:500;border-bottom:1px solid #f0f0f0}
.et td{padding:10px 12px;border-bottom:1px solid #f5f5f5}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-ok{background:#f6ffed;color:#52c41a}.badge-info{background:#e6f7ff;color:#1890ff}.badge-err{background:#fff2f0;color:#ff4d4f}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.fb{padding:6px 14px;border:1px solid #d9d9d9;border-radius:16px;font-size:12px;cursor:pointer;background:#fff;transition:all .15s}
.fb:hover{border-color:#1890ff;color:#1890ff}.fb.active{background:#1890ff;color:#fff;border-color:#1890ff}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tc{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .2s;border-left:4px solid #1890ff}
.tc:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.tc .n{font-size:16px;font-weight:600;margin-bottom:12px}
.tc .sc{font-size:24px;font-weight:700;color:#1890ff}
.tc .ch{font-size:13px;margin-left:8px}.tc .ch.up{color:#52c41a}.tc .ch.dn{color:#ff4d4f}
.tc .st{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;font-size:12px;color:#666}
.tc .st b{color:#333;font-weight:500;float:right}
.btn{padding:10px 20px;background:#1890ff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.btn:hover{background:#40a9ff}.btn-ghost{background:transparent;color:#1890ff;border:1px solid #1890ff}.btn-ghost:hover{background:#e6f7ff}
.btn-lg{padding:12px 32px;font-size:15px}
.tpl-opts{display:flex;gap:12px;margin-bottom:16px}
.tpl-opt{padding:10px 20px;border:2px solid #e8e8e8;border-radius:8px;cursor:pointer;font-size:13px}
.tpl-opt.active{border-color:#1890ff;background:#e6f7ff;color:#1890ff}
.rcfg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.rcfg .f label{display:block;font-size:12px;color:#666;margin-bottom:4px}
.rcfg .f select{width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none}
.edt-bar{display:flex;gap:4px;padding:8px 12px;background:#fafafa;border:1px solid #e8e8e8;border-radius:6px 6px 0 0}
.edt-bar button{padding:4px 8px;border:none;background:none;cursor:pointer;border-radius:4px;font-size:13px}
.edt-bar button:hover{background:#e8e8e8}
.edt-body{border:1px solid #e8e8e8;border-top:none;border-radius:0 0 6px 6px;padding:20px;min-height:300px;font-size:14px;line-height:1.8;outline:none}
.empty{text-align:center;padding:40px;color:#999;font-size:14px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:6px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.toast.show{opacity:1}.toast.err{background:#fff2f0;color:#ff4d4f;border-color:#ffccc7}
.menu-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;font-size:20px;cursor:pointer;border-radius:6px;border:1px solid #e8e8e8;margin-right:12px;flex-shrink:0;transition:all .15s}
.menu-btn:hover{border-color:#1890ff;color:#1890ff;background:#f0f7ff}
@media(max-width:768px){
  body{flex-direction:column}
  .sidebar{display:none;position:fixed;top:0;left:0;width:200px;height:100vh;z-index:200}
  .sidebar.mobile-open{display:flex;flex-direction:column}
  .sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:199}
  .sidebar.mobile-open~.sidebar-overlay{display:block}
  .main{width:100%;overflow-x:hidden}
  .topbar{padding:0 12px}
  .topbar .search{width:120px;font-size:12px}
  .content{padding:12px}
  .menu-btn{display:flex}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .sh-metrics{grid-template-columns:repeat(3,1fr)}
  .rcfg{grid-template-columns:1fr}
  .mc .value{font-size:22px}
  .card{padding:14px}
  .card h3{font-size:14px}
  .et{display:block;overflow-x:auto}
  .feed-item{padding:12px 14px}
  .feed-pager .fp{min-width:28px;height:28px;font-size:11px}
  .drawer-panel{width:100% !important;min-width:0 !important;max-width:100vw}
  #taskModal .card{width:100% !important;max-width:95vw !important}
  .tech-indicators{grid-template-columns:repeat(2,1fr) !important}
  .tech-signals{grid-template-columns:repeat(2,1fr) !important}
  .val-metrics{grid-template-columns:repeat(2,1fr) !important}
}

/* === 资讯 Feed 样式 === */
.feed-item{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .2s;border-left:4px solid #d9d9d9}
.feed-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.feed-item.policy{border-left-color:#fa8c16}.feed-item.tech{border-left-color:#1890ff}
.feed-item.funding{border-left-color:#52c41a}.feed-item.market{border-left-color:#722ed1}.feed-item.report{border-left-color:#666}
.feed-title{font-size:15px;font-weight:500;margin-bottom:8px;line-height:1.5}
.feed-title a{color:#333;text-decoration:none}.feed-title a:hover{color:#1890ff}
.feed-meta{font-size:12px;color:#999;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.feed-summary{font-size:13px;color:#666;line-height:1.7;margin-top:6px;padding:8px 12px;background:#f8f9fa;border-radius:6px}
.feed-actions{margin-top:8px;display:flex;gap:12px}
.feed-actions a{font-size:12px;color:#1890ff;cursor:pointer;text-decoration:none}
.feed-actions a:hover{text-decoration:underline}
.feed-pager{display:flex;justify-content:center;gap:6px;margin-top:16px}
.feed-pager .fp{min-width:32px;height:32px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;cursor:pointer;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s}
.feed-pager .fp:hover{border-color:#1890ff;color:#1890ff}.feed-pager .fp.active{background:#1890ff;color:#fff;border-color:#1890ff}

/* === 个股页样式 === */
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stock-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;transition:all .2s;position:relative;border:1px solid #f0f0f0}
.stock-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-2px);border-color:#1890ff}
.stock-card .sc-name{font-size:15px;font-weight:600;margin-bottom:4px}
.stock-card .sc-code{font-size:12px;color:#999}
.stock-card .sc-del{position:absolute;top:8px;right:10px;color:#ccc;cursor:pointer;font-size:16px;transition:color .15s}
.stock-card .sc-del:hover{color:#ff4d4f}
.score-ring{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;font-size:24px;font-weight:700;margin-right:20px}
.risk-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:16px;font-size:13px;font-weight:500}
.risk-badge.low{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.risk-badge.mid{background:#fffbe6;color:#faad14;border:1px solid #ffe58f}
.risk-badge.high{background:#fff2f0;color:#ff4d4f;border:1px solid #ffccc7}
.term-card{border:1px solid #f0f0f0;border-radius:10px;padding:16px;transition:all .2s}
.term-card:hover{border-color:#1890ff}
.term-card .term-label{font-size:13px;color:#999;margin-bottom:4px}
.term-card .term-signal{font-size:16px;font-weight:600;margin-bottom:8px}
.term-card .term-outlook{font-size:13px;color:#555;line-height:1.6;margin-bottom:8px}
.term-card ul{margin:0;padding-left:16px;font-size:12px;color:#666}
.alert-box{background:#fff2f0;border:1px solid #ffccc7;border-radius:8px;padding:12px 16px;margin-bottom:16px}
.alert-box .alert-title{font-size:13px;font-weight:500;color:#ff4d4f;margin-bottom:6px}

/* === 研报页样式 === */
.rpt-item{background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .2s}
.rpt-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.rpt-title{font-size:14px;font-weight:500;margin-bottom:6px;line-height:1.5}
.rpt-meta{font-size:12px;color:#999;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rpt-meta .org-tag{background:#e6f7ff;color:#1890ff;padding:2px 8px;border-radius:10px;font-size:11px}
.ai-box{background:linear-gradient(135deg,#e6f7ff,#f0f5ff);border:1px solid #91d5ff;border-radius:10px;padding:16px;margin-bottom:16px}
.ai-box .ai-label{font-size:12px;color:#1890ff;font-weight:500;margin-bottom:8px}
.ai-box .ai-text{font-size:14px;line-height:1.8;color:#333}

.view-toggle{display:inline-flex;border:1px solid #d9d9d9;border-radius:6px;overflow:hidden;margin-right:16px;font-size:12px}
.view-toggle span{padding:4px 12px;cursor:pointer;background:#fff;color:#666;transition:all .15s}
.view-toggle span.active{background:#1890ff;color:#fff}
.view-toggle span:hover:not(.active){background:#f5f5f5}
.guide-banner{background:linear-gradient(135deg,#e6f7ff 0%,#bae7ff 100%);border:1px solid #91d5ff;border-radius:8px;padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-size:14px;color:#1890ff;animation:slideDown .3s ease}
.guide-banner a{color:#0050b3;font-weight:600;text-decoration:underline;cursor:pointer}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* === 个股详情页 === */
.stock-header{background:linear-gradient(135deg,#0f3460,#16213e);color:#fff;border-radius:12px;padding:24px 28px;margin-bottom:16px;position:relative;overflow:hidden}
.stock-header::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:rgba(24,144,255,.08);border-radius:50%}
.sh-back{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;font-size:13px;opacity:.7;cursor:pointer;margin-bottom:12px;padding:4px 10px;border-radius:4px;transition:all .15s}
.sh-back:hover{opacity:1;background:rgba(255,255,255,.1)}
.sh-name{font-size:28px;font-weight:700;margin-bottom:4px}
.sh-code{font-size:14px;opacity:.7;margin-bottom:16px}
.sh-price{font-size:42px;font-weight:700}
.sh-change{font-size:18px;margin-left:12px;font-weight:500}
.sh-change.up{color:#ff4d4f}.sh-change.dn{color:#52c41a}
.sh-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15)}
.sh-metric{text-align:center}
.sh-metric .label{font-size:11px;opacity:.6;margin-bottom:4px}
.sh-metric .value{font-size:16px;font-weight:600}
.stock-tabs{display:flex;border-bottom:2px solid #f0f0f0;margin-bottom:20px;gap:0}
.stock-tab{padding:12px 24px;font-size:14px;color:#666;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;position:relative}
.stock-tab:hover{color:#1890ff}
.stock-tab.active{color:#1890ff;border-bottom-color:#1890ff;font-weight:600}
.breadcrumb{font-size:13px;color:#999;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.breadcrumb a{color:#1890ff;cursor:pointer;text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.drawer-overlay{display:none;position:fixed;top:0;right:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:900;opacity:0;transition:opacity .25s}
.drawer-overlay.open{display:block;opacity:1}
.drawer-panel{position:fixed;top:0;right:0;width:60%;max-width:800px;min-width:380px;height:100%;background:#fff;z-index:901;transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.1)}
.drawer-panel.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.drawer-header .back{width:28px;height:28px;border-radius:6px;border:1px solid #e8e8e8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#666;transition:all .15s}
.drawer-header .back:hover{border-color:#1890ff;color:#1890ff;background:#f0f7ff}
.drawer-header h3{font-size:16px;font-weight:600;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-header .close-drawer{width:28px;height:28px;border-radius:6px;border:1px solid #e8e8e8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#999;transition:all .15s}
.drawer-header .close-drawer:hover{border-color:#ff4d4f;color:#ff4d4f;background:#fff1f0}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.tech-indicators{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tech-signals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.val-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cond-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cond-row select,.cond-row input[type=number]{padding:8px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none}
.cond-row select:focus,.cond-row input[type=number]:focus{border-color:#1890ff}
.cond-row .cond-del{width:28px;height:28px;border:1px solid #e8e8e8;border-radius:6px;background:#fff;cursor:pointer;font-size:16px;color:#999;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.cond-row .cond-del:hover{border-color:#ff4d4f;color:#ff4d4f;background:#fff1f0}
.logic-radio{display:flex;gap:16px;align-items:center;margin-bottom:8px}
.logic-radio label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.logic-radio input[type=radio]{accent-color:#1890ff}
@media(max-width:768px){.cond-row{flex-wrap:wrap}.cond-row select{min-width:100px}.cond-row input[type=number]{min-width:70px}}
/* Wireframe component styles */
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.group-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #f0f0f0;transition:all .15s;cursor:pointer}
.group-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);border-color:#1890ff}
.group-card .gc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.group-card .gc-name{font-size:15px;font-weight:600;color:#333}
.group-card .gc-desc{font-size:12px;color:#999;margin-bottom:12px;line-height:1.5}
.group-card .gc-meta{display:flex;gap:16px;font-size:12px;color:#666}
.group-card .gc-meta span{display:flex;align-items:center;gap:4px}
.group-card .gc-strategies{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.group-card .gc-actions{margin-top:12px;padding-top:12px;border-top:1px solid #f5f5f5;display:flex;justify-content:space-between;align-items:center}
.event-card{display:flex;align-items:center;padding:12px 16px;border:1px solid #f0f0f0;border-radius:6px;cursor:pointer;transition:all .15s;gap:16px;margin-bottom:8px}
.event-card:hover{border-color:#1890ff;box-shadow:0 2px 8px rgba(24,144,255,.12)}
.event-card .ec-indicator{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.event-card .ec-body{flex:1;min-width:0}
.event-card .ec-name{font-size:14px;font-weight:600;color:#333}
.event-card .ec-meta{font-size:12px;color:#999;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.event-card .ec-change{font-size:16px;font-weight:700;flex-shrink:0}
.lifecycle-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:500;flex-shrink:0}
.lifecycle-tracking{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.lifecycle-suggest-close{background:#fff7e6;color:#faad14;border:1px solid #ffe58f}
.lifecycle-closed{background:#f5f5f5;color:#999;border:1px solid #d9d9d9}
.stock-snapshot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.stock-snapshot{padding:14px;border:1px solid #f0f0f0;border-radius:6px;transition:all .15s}

<script>
// === 导航与路由 ===
var _drawerStack=[];
function openDrawer(title,html){
  var ov=document.getElementById('drawerOverlay');
  var pn=document.getElementById('drawerPanel');
  document.getElementById('drawerTitle').textContent=title||'详情';
  document.getElementById('drawerBody').innerHTML=html||'<div class="empty">加载中...</div>';
  ov.classList.add('open');
  pn.classList.add('open');
  document.getElementById('drawerBack').style.display=_drawerStack.length>0?'flex':'none';
  document.addEventListener('keydown',_drawerEsc);
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawerPanel').classList.remove('open');
  document.removeEventListener('keydown',_drawerEsc);
  _drawerStack=[];
}
function _drawerEsc(e){if(e.key==='Escape')closeDrawer()}
function drawerPush(title,html){
  _drawerStack.push({title:document.getElementById('drawerTitle').textContent,html:document.getElementById('drawerBody').innerHTML});
  openDrawer(title,html);
}
function drawerGoBack(){
  if(!_drawerStack.length)return;
  var prev=_drawerStack.pop();
  document.getElementById('drawerTitle').textContent=prev.title;
  document.getElementById('drawerBody').innerHTML=prev.html;
  document.getElementById('drawerBack').style.display=_drawerStack.length>0?'flex':'none';
}

{id:'dashboard',icon:'📊',label:'概览',title:'概览'},

];
let curPage=(location.pathname.replace('/',''))||'dashboard',userRole='viewer';

function initNav(){
const nav=document.getElementById('nav');
nav.innerHTML=PAGES.map(p=>{
if(p.id==='_div'||p.id==='_div2')return'<div class="divider"></div>';
if(p.role==='admin'&&userRole!=='admin')return'';
if(p.role==='editor'&&userRole==='viewer')return'';
if(p.href)return`<a href="${p.href}">${p.icon} <span>${p.label}</span></a>`;
return`<a href="#" data-p="${p.id}" class="${p.id===curPage?'active':''}" style="position:relative">${p.icon} <span>${p.label}</span>${p.id==='alert'?'<span class="alert-badge" id="alertBadge"></span>':''}</a>`;
}).join('');
nav.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();var sb=document.querySelector('.sidebar');if(sb)sb.classList.remove('mobile-open');goPage(a.dataset.p)});
}

function goPage(id,push=true){
curPage=id;
document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.p===id));
const p=PAGES.find(x=>x.id===id);
document.getElementById('pageTitle').textContent=p?p.title:id;
if(push&&id!==(location.pathname.replace('/','')||'dashboard'))history.pushState({page:id},'', '/'+(id==='dashboard'?'':id));
loadPage(id);
}
window.addEventListener('popstate',e=>{if(e.state&&e.state.page)goPage(e.state.page,false)});


function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2500)}
function toggleMobileMenu(){var s=document.querySelector(".sidebar");s.classList.toggle("mobile-open");setTimeout(function(){window._echartsInstances.forEach(function(c){try{c.resize()}catch(e){}})},350)}
var _echartsInstances=[];
function _registerChart(c){if(c)_echartsInstances.push(c)}
function _echInit(el){var c=echarts.init(el);_registerChart(c);return c}
function api(url,opt){return fetch(url,{headers:{'Content-Type':'application/json'},...opt}).then(r=>{if(!r.ok)return r.json().then(d=>{throw new Error(d.error||'请求失败 ('+r.status+')')});return r.json()})}
function apiV(url,opt){if(window.viewAll&&url.includes('/api/')){const sep=url.includes('?')?'&':'?';return api(url+sep+'view=all',opt)}return api(url,opt)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function decodeBuyStar(code){code=code||0;if(code===-1)return{signalCount:0,tags:['风险否决'],cls:'risk'};if(code===0)return{signalCount:0,tags:[],cls:'none'};var c=code,tags=[];if(c>=3e8){tags.push('BOLL中轨');c-=3e8}if(c>=2e7){tags.push('MA20支撑');c-=2e7}if(c>=1e6){tags.push('3日MA5');c-=1e6}if(c>=1e5){tags.push('2日MA5');c-=1e5}if(c>=1e4){tags.push('MA5支撑');c-=1e4}if(c>=1e3){tags.push('低位反转');c-=1e3}if(c>=10){tags.push('KDJ底部');c-=10}if(c>=1)tags.push('金叉');return{signalCount:tags.length,tags:tags,cls:'signal'}}
function renderBuyStar(code){var info=decodeBuyStar(code);if(info.cls==='risk')return'<span style="color:#FF4D4F;font-size:12px">⚠ 风险否决</span>';if(info.cls==='none')return'<span style="color:#bbb">—</span>';return'<span style="font-size:11px;color:#555">'+info.tags.map(function(t){return'<span style="display:inline-block;padding:1px 5px;margin:0 2px;border-radius:3px;background:#E6F7FF;color:#1890FF;font-size:11px">'+t+'</span>'}).join('')+'</span>'}

function tagHtml(type){const m={policy:'政策',funding:'融资',tech:'技术',market:'市场',report:'研报'};return`<span class="tag tag-${type||'tech'}">${m[type]||type||''}</span>`}
function cronToLabel(c){if(!c)return'-';const m={'0 */1 * * *':'每小时','0 */2 * * *':'每2小时','0 */4 * * *':'每4小时','0 */6 * * *':'每6小时','0 8,12,18 * * *':'每天3次(8/12/18点)','0 9 * * 1-5':'工作日每天1次'};if(m[c])return m[c];const dm=c.match(/^0 (\d{1,2}) \* \* \*$/);if(dm)return'每天 '+dm[1]+'点';const wm=c.match(/^0 (\d{1,2}) \* \* (\d+)$/);if(wm){const wd=['','周一','周二','周三','周四','周五','周六','周日'];return(wd[parseInt(wm[2])]||'周'+wm[2])+' '+wm[1]+'点'}return c}
function freqToLabel(f){if(!f)return'-';const m={daily:'每日',weekly:'每周',monthly:'每月'};return m[f]||f}

const loaders={dashboard:loadDashboard,track:loadTrack,feed:loadFeed,weekly:loadWeekly,stock:loadStock,recommend:loadRecommend,report:loadReport,tasks:loadTasks,monitor:loadMonitor,settings:loadSettings,policy:loadPolicy,follows:loadFollows,alert:loadAlert,portfolio:loadPortfolio,investment:loadInvestment,'strategy-discover':loadStrategyDiscover,'backtest':loadBacktest,'my-strategy':loadMyStrategy,'strategy-admin':loadStrategyAdmin,'chanlun-czsc':loadChanlunCzsc,macro:loadMacro};

}

if(window._showGuide){el.parentElement.querySelectorAll('.guide-banner').forEach(b=>b.remove());const gb=document.createElement('div');gb.className='guide-banner';gb.innerHTML='👋 欢迎使用 D8Q！请先选择您关注的赛道，我们将为您个性化推荐内容。<a onclick="goPage(\'follows\')">去关注 →</a>';el.parentElement.insertBefore(gb,el);window._showGuide=false;}

<div class="card"><h3>今日要闻 <a class="more" onclick="goPage('feed')">更多 →</a></h3>${newsItems.slice(0,5).map(n=>`<div class="ni"><div class="t">${n.url?`<a href="${n.url}" target="_blank" style="color:#333;text-decoration:none">${esc(n.title)}</a>`:esc(n.title)}</div><div class="m">${(n.publish_time||'').slice(5,16)} · ${n.source}</div></div>`).join('')}</div>
</div>
`;

async function loadDashChart(latestHeat){
const data=await apiV('/api/proxy/tracks/heat?days=7');
if(!data||!data.length)return;
// Collect all unique dates and sort
const allDates=[...new Set(data.map(d=>d.date))].sort();
const dateLabels=allDates.map(d=>d.slice(5));
// Build per-track data aligned to allDates
const tracks={};
data.forEach(d=>{if(!tracks[d.name])tracks[d.name]={color:d.color,map:{}};tracks[d.name].map[d.date]=d.score});
const series=Object.entries(tracks).map(([name,v])=>({name,type:'line',smooth:true,data:allDates.map(dt=>v.map[dt]??null),itemStyle:{color:v.color},lineStyle:{color:v.color}}));
const chart=_echInit(document.getElementById('dashChart'));
chart.setOption({tooltip:{trigger:'axis'},legend:{top:0,right:0,textStyle:{fontSize:11}},grid:{top:30,bottom:20,left:40,right:20},xAxis:{type:'category',data:dateLabels},yAxis:{type:'value',max:100},series});

}

let feedPage=1,feedSubject='',feedType='';
async function loadFeed(el){
const meta=await api('/api/meta');
el.innerHTML=`
<div class="filters" id="fSubjects"><span class="fb active" data-v="">全部赛道</span>${(meta.subjects||[]).map(s=>`<span class="fb" data-v="${s}">${s}</span>`).join('')}</div>
<div class="filters" id="fTypes"><span class="fb active" data-v="">全部分类</span><span class="fb" data-v="policy">政策</span><span class="fb" data-v="funding">融资</span><span class="fb" data-v="tech">技术</span><span class="fb" data-v="market">市场</span><span class="fb" data-v="report">研报</span></div>
<div class="card" id="feedList"><div class="empty">加载中...</div></div>
<div id="feedPager" style="text-align:center;margin-top:12px"></div>`;
document.querySelectorAll('#fSubjects .fb').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fSubjects .fb').forEach(x=>x.classList.remove('active'));b.classList.add('active');feedSubject=b.dataset.v;feedPage=1;renderFeed()});
document.querySelectorAll('#fTypes .fb').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fTypes .fb').forEach(x=>x.classList.remove('active'));b.classList.add('active');feedType=b.dataset.v;feedPage=1;renderFeed()});
feedPage=1;renderFeed();
}

async function renderFeed(){
let url=`/api/news?page=${feedPage}&size=10`;
if(feedSubject)url+=`&subject=${feedSubject}`;
const data=await apiV(url);
const items=(data.items||[]).filter(n=>!feedType||n.news_type===feedType);
document.getElementById('feedList').innerHTML=items.length?items.map(n=>{
const cls=n.news_type||'';
return `<div class="feed-item ${cls}">
<div class="feed-title">${n.url?`<a href="${n.url}" target="_blank">${esc(n.title)}</a>`:esc(n.title)}</div>
<div class="feed-meta">${tagHtml(n.news_type)}<span>📅 ${(n.publish_time||'').slice(0,16)}</span><span>📰 ${esc(n.source||'')}</span><span>🔥 ${esc(n.subject||'')}</span></div>
${n.ai_summary?`<div class="feed-summary">💡 ${esc(n.ai_summary)}</div>`:(n.content?`<div class="feed-summary">${esc(n.content.slice(0,150))}${n.content.length>150?'...':''}</div>`:'')}
<div class="feed-actions">${n.url?`<a href="${n.url}" target="_blank">查看原文 →</a>`:''}<a onclick="toast('已加入周报素材')">📝 加入周报</a></div>
</div>`;}).join(''):'<div class="empty">暂无数据</div>';
const pages=Math.ceil((data.total||0)/10);
document.getElementById('feedPager').innerHTML=pages>1?'<div class="feed-pager">'+Array.from({length:Math.min(pages,10)},(_,i)=>`<div class="fp${feedPage===i+1?' active':''}" onclick="feedPage=${i+1};renderFeed()">${i+1}</div>`).join('')+'</div>':'';
}

async function loadStrategyDiscover(el){
const [groups,subs] = await Promise.all([api('/api/strategy/groups?status=active'),api('/api/strategy/subscriptions/')]);
const groupList = Array.isArray(groups) ? groups : (groups.groups || groups.items || []);
const subList = Array.isArray(subs) ? subs : (subs.subscriptions || subs.items || []);
const subIds = new Set(subList.map(s => s.strategy_group_id));
const subscribed = groupList.filter(g => subIds.has(g.id)).length;
el.innerHTML = `
<div class="wf-stat-grid">
  <div class="wf-stat-card"><div class="wf-stat-value" style="color:#1890ff">${groupList.length}</div><div class="wf-stat-label">可订阅策略组</div></div>
  <div class="wf-stat-card"><div class="wf-stat-value" style="color:#52c41a">${subscribed}</div><div class="wf-stat-label">已订阅</div></div>
  <div class="wf-stat-card"><div class="wf-stat-value" style="color:#faad14">-</div><div class="wf-stat-label">活跃事件</div></div>
  <div class="wf-stat-card"><div class="wf-stat-value" style="color:#722ed1">-</div><div class="wf-stat-label">平均命中率</div></div>
</div>
<div class="wf-toolbar">
  <div class="wf-toolbar-left">
    <input class="wf-search" placeholder="搜索策略组..." oninput="filterDiscoverCards(this.value)">
  </div>
</div>
<div class="group-grid" id="discoverGrid">
${groupList.map(g => {
  const isSub = subIds.has(g.id);
  return `<div class="group-card" data-name="${esc(g.name)}">
    <div class="gc-header">
      <span class="gc-name">${esc(g.name)}</span>
      <div>${g.status==='active'?'<span class="badge badge-ok">运行中</span>':'<span class="badge" style="background:#d9d9d6;color:#666">已暂停</span>'} ${isSub?'<span class="badge badge-info">已订阅</span>':''}</div>
    </div>
    <div class="gc-desc">${esc(g.description||'暂无描述')}</div>
    <div class="gc-meta">
      <span>📊 总信号: ${g.total_signals||0}</span>
      <span>🎯 事件: ${g.total_events||0}</span>
      <span>🕐 ${g.last_scan_at?(g.last_scan_at+'').slice(5,16):'未扫描'}</span>
    </div>
    <div class="gc-actions">
      ${isSub
        ? '<button class="btn-ghost" style="font-size:12px;padding:4px 12px" onclick="goPage(\'my-strategy\')">📌 查看我的策略</button><button class="btn-ghost" style="font-size:12px;padding:4px 12px;color:#ff4d4f" onclick="unsubscribeStrategy('+g.id+')">取消订阅</button>'
        : '<button class="btn" style="font-size:12px;padding:4px 16px" onclick="subscribeStrategy('+g.id+')">+ 订阅此策略</button>'}
    </div>
  </div>`;
}).join('')}
</div>`;
}
function filterDiscoverCards(q){
  const grid=document.getElementById('discoverGrid');
  if(!grid)return;
  const kw=q.toLowerCase();
  grid.querySelectorAll('.group-card').forEach(c=>{
    c.style.display=c.dataset.name.toLowerCase().includes(kw)?'':'none';
  });
}

async function subscribeStrategy(gid){
try{
await api('/api/strategy/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy_group_id:gid})});
toast('已订阅');loadStrategyDiscover(document.getElementById('contentArea'));
}catch(e){toast(e.message,true)}
}
async function unsubscribeStrategy(gid){
try{
await api('/api/strategy/subscription/'+gid,{method:'DELETE'});
toast('已取消订阅');loadStrategyDiscover(document.getElementById('contentArea'));
}catch(e){toast(e.message,true)}
}

async function loadMyStrategy(el){
const subs = await api('/api/strategy/subscriptions/');
const subList = Array.isArray(subs) ? subs : (subs.subscriptions || subs.items || []);
el.innerHTML = `
<div class="wf-stat-grid">
  <div class="wf-stat-card"><div class="wf-stat-value" style="color:#1890ff">${subList.length}</div><div class="wf-stat-label">已订阅策略</div></div>
  <div class="wf-stat-card"><div class="wf-stat-value" style="color:#52c41a" id="my-active-events">-</div><div class="wf-stat-label">活跃事件</div></div>
  <div class="wf-stat-card"><div class="wf-stat-value" style="color:#faad14">-</div><div class="wf-stat-label">关联板块涨幅</div></div>
  <div class="wf-stat-card"><div class="wf-stat-value" style="color:#722ed1">-</div><div class="wf-stat-label">今日信号</div></div>
</div>
${subList.length === 0 ? '<div class="card"><div class="empty" style="padding:60px 20px;text-align:center"><div style="font-size:48px;margin-bottom:16px">📭</div><p style="color:#999;font-size:14px">暂未订阅任何策略，前往 <a href="#" onclick="goPage(\'strategy-discover\');return false" style="color:#1890ff">策略发现</a> 订阅</p></div></div>' : subList.map(sub => {
  var g = sub.group||{};
  var gName = g.name || sub.strategy_name || ('策略组 #'+sub.strategy_group_id);
  var gStatus = g.status||'active';
  var gCondCount = (g.conditions||[]).length || (g.indicators||[]).length || 0;
  var statusText = gStatus==='active'?'运行中':gStatus==='paused'?'已暂停':'已归档';
  var statusBadge = gStatus==='active'?'badge-ok':'badge';
  return `<div class="card" style="margin-bottom:16px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <h3 style="border:none;margin:0;padding:0">📌 ${esc(gName)}</h3>
      <div style="font-size:12px;color:#999;margin-top:4px">${gCondCount} 个策略 · <span class="badge ${statusBadge}" style="font-size:10px">${statusText}</span></div>
    </div>
    <button class="btn-ghost" style="font-size:12px;padding:4px 12px;color:#ff4d4f" onclick="unsubscribeStrategy(${sub.strategy_group_id});loadMyStrategy(document.getElementById('contentArea'))">取消订阅</button>
  </div>
  <div style="font-size:13px;color:#666;margin-bottom:10px">🎯 活跃事件 <span id="my-evt-count-${sub.strategy_group_id}" class="badge badge-info" style="font-size:11px">...</span></div>
  <div id="my-events-${sub.strategy_group_id}" style="color:#999;font-size:13px">加载事件中...</div>
</div>`;
}).join('')}`;
// load events for each subscription
let totalActiveEvents = 0;
subList.forEach(async sub => {
  const area = document.getElementById('my-events-'+sub.strategy_group_id);
  if(!area) return;
  try{
    const edata = await api('/api/events?strategy_group_id='+sub.strategy_group_id+'&status=open');
    const events = Array.isArray(edata) ? edata : (edata.items || edata.events || []);
    const countEl = document.getElementById('my-evt-count-'+sub.strategy_group_id);
    if(countEl) countEl.textContent = events.length;
    totalActiveEvents += events.length;
    const activeEl = document.getElementById('my-active-events');
    if(activeEl) activeEl.textContent = totalActiveEvents;
    if(!events.length){
      area.innerHTML='<div class="empty" style="padding:20px;text-align:center;color:#999"><div style="font-size:32px">📭</div><p style="font-size:13px;margin-top:8px">暂无活跃事件</p></div>';
      return;
    }
    area.innerHTML = events.map(e => {
      const lc = e.lifecycle||'tracking';
      const lcClass = lc==='tracking'?'lifecycle-tracking':lc==='suggest_close'?'lifecycle-suggest-close':'lifecycle-closed';
      const lcText = lc==='tracking'?'● 跟踪中':lc==='suggest_close'?'⚠ 建议关闭':'⚪ 已关闭';
      const confirmEmojis = '✅'.repeat(Math.min(3,Math.round((e.news_confirm_score||0)*3))) || '-';
      const changePct = e.sector_change_pct;
      const changeColor = changePct>0?'#52c41a':'#ff4d4f';
      const changeText = changePct!=null?(changePct>0?'+':'')+Number(changePct).toFixed(2)+'%':'-';
      return `<div class="event-card" onclick="showEventDetail(${e.id})">
        <div class="ec-indicator" style="background:#e6f7ff">🧩</div>
        <div class="ec-body">
          <div class="ec-name">${esc(e.dimension_value||e.target_name||'事件 #'+e.id)}</div>
          <div class="ec-meta">
            <span>🎯 ${e.stock_count||0}只触发</span>
            <span>${confirmEmojis} 确认度</span>
            <span>📅 ${(e.created_at||'').slice(0,10)}</span>
            <span>📰 关联资讯 ${(e.news_count||0)}条</span>
          </div>
        </div>
        <div class="ec-change" style="color:${changeColor}">${changeText}</div>
        <span class="lifecycle-badge ${lcClass}">${lcText}</span>
      </div>`;
    }).join('');
  }catch(ex){area.innerHTML='<div style="color:#ff4d4f;font-size:13px">加载失败</div>'}
});
}

async function showEventDetail(eid){
const data = await api('/api/events/'+eid);
const e = data.event || data;
const [micro,macro,info] = await Promise.all([
  api('/api/events/'+eid+'/micro').catch(()=>({})),
  api('/api/events/'+eid+'/macro').catch(()=>({})),
  api('/api/events/'+eid+'/info').catch(()=>({}))
]);
const stocks = micro.stocks || micro.items || [];
const dailyStats = macro.daily_stats || [];
const sectorTrend = macro.sector_trend || [];

const title = e.dimension_value || e.target_name || '事件 #'+e.id;
const confirmScore = e.news_confirm_score || 0;
const confirmEmojis = '✅'.repeat(Math.min(3,Math.round(confirmScore*3))) || '-';
const lc = e.lifecycle||'tracking';
const lcClass = lc==='tracking'?'lifecycle-tracking':lc==='suggest_close'?'lifecycle-suggest-close':'lifecycle-closed';
const lcText = lc==='tracking'?'● 跟踪中':lc==='suggest_close'?'⚠ 建议关闭':'⚪ 已关闭';
const changePct = e.sector_change_pct;
const changeColor = changePct>0?'#52c41a':'#ff4d4f';
const changeText = changePct!=null?(changePct>0?'+':'')+Number(changePct).toFixed(2)+'%':'-';

openDrawer(title,`
<div>
  <!-- Lifecycle badge + action buttons -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
    <span class="lifecycle-badge ${lcClass}">${lcText}</span>
    <div style="margin-left:auto;display:flex;gap:8px">
      ${lc==='suggest_close'?'<button class="btn" style="font-size:12px;padding:4px 12px" title="系统建议关闭：信号已衰减">⚠️ 建议关闭</button>':''}
      ${userRole==='admin'&&(lc==='tracking'||lc==='suggest_close')?'<button class="btn" style="font-size:12px;padding:4px 12px;background:#1890ff;color:#fff;border-color:#1890ff" onclick="closeEvent('+eid+')">✅ 确认关闭</button>':''}

    <div class="wf-stat-card"><div class="wf-stat-value">${confirmEmojis}</div><div class="wf-stat-label">确认度</div></div>
    <div class="wf-stat-card"><div class="wf-stat-value">${e.duration_days||0}天</div><div class="wf-stat-label">持续跟踪</div><div class="wf-stat-change">${(e.created_at||'').slice(0,10)?'自 '+(e.created_at+'').slice(0,10):''}</div></div>
    <div class="wf-stat-card"><div class="wf-stat-value" style="color:${changeColor}">${changeText}</div><div class="wf-stat-label">板块累计涨跌</div></div>
  </div>

  <!-- Tab bar: 微观 / 宏观 / 信息关联 -->

    <div class="wf-tab-item" onclick="wfSwitchTab(this,'evtInfo${eid}')">🔗 信息关联</div>

function serializeConditions(){
  var rows=document.querySelectorAll('#condRows .cond-row');
  var indicators=[];
  var conditions=[];
  rows.forEach(function(row){
    var ind=row.querySelector('select').value;
    var op=row.querySelectorAll('select')[1].value;
    var val=row.querySelector('input[type=number]').value;
    if(!ind||val==='')return;
    if(indicators.indexOf(ind)===-1)indicators.push(ind);
    conditions.push({indicator:ind,operator:op,value:parseFloat(val)});
  });
  return {indicators:indicators,conditions:conditions};
}
function parseConditions(indicators){
  var conds=[];
  try{
    var obj=(typeof indicators==='string')?JSON.parse(indicators):indicators;
    Object.keys(obj||{}).forEach(function(groupKey){
      var group=obj[groupKey];
      var conditions=group.conditions||[];
      conditions.forEach(function(c){
        var parsed=_parseCondStr(c,groupKey);
        if(parsed)conds.push(parsed);
      });
    });
  }catch(e){}
  return conds;
}
function _parseCondStr(str,groupKey){
  var ops=['cross_above','cross_below','<=','>=','==','<','>'];
  for(var i=0;i<ops.length;i++){
    var idx=str.indexOf(ops[i]);
    if(idx>=0){
      var left=str.substring(0,idx);
      var op=ops[i];
      var val=str.substring(idx+op.length);
      var indicator=_resolveIndicator(left,groupKey);
      return{indicator:indicator,operator:op,value:parseFloat(val)};
    }
  }
  return null;
}
function _resolveIndicator(short,groupKey){
  if(groupKey==='kdj')return'kdj_'+short;
  if(groupKey==='rsi')return short;
  if(groupKey==='volume')return'volume_'+short;
  if(groupKey==='boll')return'boll_'+short;
  if(groupKey==='ma')return'ma_'+short;
  return short;
}

}

function serializeAggregation(){
  var dim=document.getElementById('sgAggDim');
  var stocks=document.getElementById('sgAggStocks');

  return {dimension:dim?dim.value:'industry',min_stocks:stocks?parseInt(stocks.value)||3:3,time_window_minutes:minutes};
}

  try{var obj=(typeof agg==='string')?JSON.parse(agg):agg;return obj||{}}catch(e){return{}}
}

function exportReportCSV(){

if(!results||!results.length){alert('\u65e0\u53ef\u5bfc\u51fa\u6570\u636e');return}
var bom='\uFEFF';
var rows=[['\u80a1\u7968\u540d\u79f0','\u7c7b\u578b','\u6807\u9898','\u673a\u6784','\u4f5c\u8005','\u65e5\u671f','\u5206\u7c7b','\u9875\u6570','\u6587\u4ef6\u5927\u5c0f(KB)','\u6458\u8981','\u94fe\u63a5']];
results.forEach(function(r){
if(!r)return;
var name=r.stock_name||r.stock_code||'';
(r.reports||[]).forEach(function(rpt){
var summary=(rpt.summary||'').replace(/<[^>]+>/g,'').trim();
rows.push([name,'\u7814\u62a5',rpt.title||'',rpt.org||'',rpt.authors||'',rpt.date||'',rpt.category||'',rpt.pages||'',rpt.file_size_kb||'',summary,rpt.detail_url||'']);
});
(r.announcements||[]).forEach(function(a){
rows.push([name,'\u516c\u544a',a.title||'','','',a.date||'','','',a.pdf_size_kb||'',a.detail_url||'']);
});
});
var csv=bom+rows.map(function(row){return row.map(function(cell){var s=String(cell).replace(/"/g,'""');return '"'+s+'"'}).join(',')}).join('\n');
var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');a.href=url;
var d=new Date();a.download='\u7814\u62a5\u5bfc\u51fa_'+d.getFullYear()+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+(d.getDate()<10?'0':'')+d.getDate()+'.csv';
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

async function switchCollectMode(mode){

async function onTrackSelect(){

async function saveCollect(){
var sched=schedToCron();
if(window._editTaskId){
var body={cron_expr:sched.cron,time_window_hours:sched.time_window_hours,max_results:200};
if(window._collectMode!=='track'){
body.subject=document.getElementById('mSubject').value.trim();
if(!body.subject){toast('主题必填',true);return}
body.sources=[];document.querySelectorAll('#taskModal input[type=checkbox]:checked').forEach(c=>body.sources.push(c.value));
}
await api('/api/tasks/'+window._editTaskId,{method:'PUT',body:JSON.stringify(body)});
toast('采集任务已更新');window._editTaskId=null;
}else if(window._collectMode==='track'){

if(!trackId){toast('请选择赛道',true);return}
await api('/api/tasks',{method:'POST',body:JSON.stringify({track_id:parseInt(trackId),cron_expr:sched.cron,max_results:200,time_window_hours:sched.time_window_hours})});
toast('采集任务已创建');
}else{
var subject=document.getElementById('mSubject').value.trim();
if(!subject){toast('主题必填',true);return}
var sources=[];document.querySelectorAll('#taskModal input[type=checkbox]:checked').forEach(c=>sources.push(c.value));
await api('/api/tasks',{method:'POST',body:JSON.stringify({subject,sources,cron_expr:sched.cron,max_results:200,time_window_hours:sched.time_window_hours})});
toast('采集任务已创建');
}
closeModal();loadTasks(document.getElementById('contentArea'));
 }

async function savePromptCfg(svc,key,i){
const body={name:document.querySelector('#pc-'+i+' b').textContent,version:1,
model:document.getElementById('pm-'+i).value,temperature:parseFloat(document.getElementById('pt-'+i).value),
max_tokens:parseInt(document.getElementById('pk-'+i).value),system:document.getElementById('ps-'+i).value,
template:document.getElementById('ptl-'+i).value};
if(_pAll[svc]&&_pAll[svc][key]&&_pAll[svc][key].description)body.description=_pAll[svc][key].description;
const url=svc==='factory'?'/api/prompts/'+key:'/api/prompts/'+svc+'/'+key;
const r=await api(url,{method:'PUT',body:JSON.stringify(body)});
if(r.success){toast('保存成功 ✅');_pAll[svc][key]=Object.assign({},_pAll[svc][key],body);}
else toast(r.error||'保存失败');

let _polData = [];
function filterPol(impact){
document.querySelectorAll('#polFilters .fb').forEach(b => b.classList.toggle('active', b.dataset.v === impact));
renderPolList(impact);
}
function renderPolList(filterImpact){
const list = filterImpact ? _polData.filter(p => p.impact === filterImpact) : _polData;
const container = document.getElementById('polList');
const total = _polData.length;
const pos = _polData.filter(p=>p.impact==='利好').length;
const neu = _polData.filter(p=>p.impact==='中性').length;
const neg = _polData.filter(p=>p.impact==='利空').length;
// 更新统计
if(total>0){
  document.getElementById('polStats').style.display='';
  document.getElementById('ps_total').textContent=total;
  document.getElementById('ps_positive').textContent=pos;
  document.getElementById('ps_neutral').textContent=neu;
  document.getElementById('ps_negative').textContent=neg;
  const classified=pos+neu+neg;
  if(classified>0){
    document.getElementById('polBar').style.display='';
    document.getElementById('pb_pos').style.width=(pos/classified*100)+'%';
    document.getElementById('pb_neu').style.width=(neu/classified*100)+'%';
    document.getElementById('pb_neg').style.width=(neg/classified*100)+'%';
  }
}
if(!list.length){container.innerHTML='<div class="pol-empty"><div class="icon">🔍</div><div class="text">暂无符合条件的政策</div></div>';return}
container.innerHTML = list.map(p => {
  const cls = p.impact==='利好'?'positive':p.impact==='利空'?'negative':p.impact?'neutral':'';
  return `<div class="pol-item ${cls}">
  <div class="pol-title">${p.url?`<a href="${esc(p.url)}" target="_blank">${esc(p.title)}</a>`:esc(p.title)}</div>
  <div class="pol-meta">
    <span>📅 ${(p.publish_time||'').slice(0,10)}</span>
    <span>📰 ${esc(p.source||'')}</span>
    ${p.track_name?`<span>🔥 ${esc(p.track_name)}</span>`:''}
  </div>
  <div class="pol-actions">
    ${p.impact?`<span class="pol-tag ${cls}">${p.impact}</span>`:''}
    ${p.category?`<span class="pol-tag category">${esc(p.category)}</span>`:''}
    ${!p.impact?`<span style="font-size:12px;color:#1890ff;cursor:pointer" onclick="classifyOne(${p.id},this)">🤖 AI 分析</span>`:''}
  </div>
  ${p.summary?`<div class="pol-summary">${esc(p.summary)}</div>`:''}
</div>`;}).join('');
}

async function analyzePolicies(){
const trackId = document.getElementById('pol_track').value;
const days = document.getElementById('pol_days').value;
const url = trackId ? "/api/proxy/tracks/"+trackId+"/news?days="+days : "/api/proxy/tracks/1/news?days="+days;
document.getElementById('polList').innerHTML = '<div class="pol-empty"><div class="icon"><span class="pol-spin">⏳</span></div><div class="text">正在加载资讯...</div></div>';
const news = await apiV(url);
const newsItems = news && news.items ? news.items : (Array.isArray(news) ? news : []);
if(!newsItems.length){document.getElementById('polList').innerHTML = '<div class="pol-empty"><div class="icon">📭</div><div class="text">暂无资讯数据</div></div>';return}
_polData = newsItems.map(n => ({...n, impact: '', category: '', summary: '', track_name: ''}));
document.getElementById('polCount').textContent = '共 ' + newsItems.length + ' 条资讯';
document.getElementById('polStats').style.display='';
document.getElementById('ps_total').textContent = newsItems.length;
document.getElementById('ps_positive').textContent = 0;
document.getElementById('ps_neutral').textContent = 0;
document.getElementById('ps_negative').textContent = 0;
document.getElementById('polBar').style.display='none';
renderPolList('');
}

async function classifyOne(newsId, el){
el.innerHTML = '<span class="pol-spin">⏳</span> 分析中...';
el.style.pointerEvents='none';
const newsItem = _polData.find(n => n.id === newsId);
if(!newsItem) return;
try{
  const result = await api('/api/policy/classify', {method:'POST', body: JSON.stringify({content: newsItem.title + ' ' + (newsItem.content||'')})});
  if(result && result.policy && result.policy.is_policy){
    const p = result.policy;
    newsItem.impact = p.impact || '中性';
    newsItem.category = p.category || '';
    newsItem.summary = p.summary || '';
  }
}catch(e){}
renderPolList(document.querySelector('#polFilters .fb.active')?.dataset.v || '');
}

async function batchClassify(){
if(!_polData.length){toast('请先加载资讯数据');return}
let done=0,total=_polData.filter(i=>!i.impact).length,利好=0,利空=0,中性=0;
const progEl=document.getElementById('polProgress');
const progText=document.getElementById('polProgressText');
progEl.classList.add('show');
for(const item of _polData){
  if(item.impact) continue;
  done++;
  progText.textContent=`正在分析 ${done}/${total}... ${item.title.slice(0,20)}`;
  const result = await api('/api/policy/classify', {method:'POST', body: JSON.stringify({content: item.title + ' ' + (item.content||'')})});
  if(result && result.policy && result.policy.is_policy){
    item.impact = result.policy.impact || '中性';
    item.category = result.policy.category || '';
    item.summary = result.policy.summary || '';
    if(item.impact==='利好')利好++; else if(item.impact==='利空')利空++; else 中性++;
  }
  if(done%5===0||done===total) renderPolList(document.querySelector('#polFilters .fb.active')?.dataset.v || '');
}
progEl.classList.remove('show');
renderPolList(document.querySelector('#polFilters .fb.active')?.dataset.v || '');
toast(`✅ 分析完成：🟢利好${利好} ⚪中性${中性} 🔴利空${利空}`);
}

// === 技术指标计算函数 ===
function calcEMA(data, period) {
  if (!data || data.length === 0) return [];
  var result = new Array(data.length);
  var k = 2 / (period + 1);
  result[0] = data[0];
  for (var i = 1; i < data.length; i++) {
    result[i] = data[i] * k + result[i - 1] * (1 - k);
  }
  return result;
}

function calcMA(closes, periods) {
  var result = {};
  for (var pi = 0; pi < periods.length; pi++) {
    var p = periods[pi];
    var arr = new Array(closes.length);
    for (var i = 0; i < closes.length; i++) {
      if (i < p - 1) { arr[i] = null; continue; }
      var sum = 0;
      for (var j = i - p + 1; j <= i; j++) sum += closes[j];
      arr[i] = sum / p;
    }
    result[p] = arr;
  }
  return result;
}

function calcMACD(closes, short, long, signal) {
  short = short || 12; long = long || 26; signal = signal || 9;
  var emaShort = calcEMA(closes, short);
  var emaLong = calcEMA(closes, long);
  var dif = [];
  for (var i = 0; i < closes.length; i++) dif.push(emaShort[i] - emaLong[i]);
  var dea = calcEMA(dif, signal);
  var macd = [];
  for (var i = 0; i < closes.length; i++) macd.push(2 * (dif[i] - dea[i]));
  return { dif: dif, dea: dea, macd: macd };
}

function calcKDJ(highs, lows, closes, n, m1, m2) {
  n = n || 9; m1 = m1 || 3; m2 = m2 || 3;
  var len = closes.length;
  var K = new Array(len), D = new Array(len), J = new Array(len);
  var prevK = 50, prevD = 50;
  for (var i = 0; i < len; i++) {
    var start = Math.max(0, i - n + 1);
    var hn = -Infinity, ln = Infinity;
    for (var j = start; j <= i; j++) {
      if (highs[j] > hn) hn = highs[j];
      if (lows[j] < ln) ln = lows[j];
    }
    var rsv = (hn === ln) ? 50 : ((closes[i] - ln) / (hn - ln)) * 100;
    var k = (2 / m1) * prevK + (1 / m1) * rsv;
    var d = (2 / m2) * prevD + (1 / m2) * k;
    var jv = 3 * k - 2 * d;
    K[i] = k; D[i] = d; J[i] = jv;
    prevK = k; prevD = d;
  }
  return { k: K, d: D, j: J };
}

function calcBOLL(closes, n, k) {
  n = n || 20; k = k || 2;
  var len = closes.length;
  var upper = new Array(len), mid = new Array(len), lower = new Array(len);
  for (var i = 0; i < len; i++) {
    if (i < n - 1) { mid[i] = null; upper[i] = null; lower[i] = null; continue; }
    var sum = 0;
    for (var j = i - n + 1; j <= i; j++) sum += closes[j];
    var avg = sum / n;
    var sqSum = 0;
    for (var j = i - n + 1; j <= i; j++) sqSum += Math.pow(closes[j] - avg, 2);
    var std = Math.sqrt(sqSum / n);
    mid[i] = avg;
    upper[i] = avg + k * std;
    lower[i] = avg - k * std;
  }
  return { upper: upper, mid: mid, lower: lower };
}

function calcRSI(closes, periods) {
  periods = periods || [6, 12, 24];
  var result = {};
  for (var pi = 0; pi < periods.length; pi++) {
    var p = periods[pi];
    var arr = new Array(closes.length);
    for (var i = 0; i < closes.length; i++) arr[i] = null;
    for (var i = p; i < closes.length; i++) {
      var gains = 0, losses = 0;
      for (var j = i - p + 1; j <= i; j++) {
        var diff = closes[j] - closes[j - 1];
        if (diff > 0) gains += diff;
        else losses -= diff;
      }
      var avgGain = gains / p;
      var avgLoss = losses / p;
      arr[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
    }
    result[p] = arr;
  }
  return result;
}

function evalTechSignals(closes,highs,lows){
  var signals=[];
  var ma5=calcMA(closes,5),ma10=calcMA(closes,10),ma20=calcMA(closes,20);
  var last=closes.length-1;
  if(ma5[last]>ma10[last]&&ma10[last]>ma20[last])signals.push({name:'MA',val:'多头排列',sig:'buy'});
  else if(ma5[last]<ma10[last]&&ma10[last]<ma20[last])signals.push({name:'MA',val:'空头排列',sig:'sell'});
  else signals.push({name:'MA',val:'交叉',sig:'neutral'});
  var mr=calcMACD(closes,12,26,9);
  if(mr.macd[last]>0)signals.push({name:'MACD',val:'金叉',sig:'buy'});
  else signals.push({name:'MACD',val:'死叉',sig:'sell'});
  var kr=calcKDJ(highs,lows,closes,9,3,3);
  if(kr.j[last]>80)signals.push({name:'KDJ',val:'超买',sig:'sell'});
  else if(kr.j[last]<20)signals.push({name:'KDJ',val:'超卖',sig:'buy'});
  else signals.push({name:'KDJ',val:'中性('+kr.j[last].toFixed(1)+')',sig:'neutral'});
  var rsi6=calcRSI(closes,[6])[6];
  if(rsi6[last]>70)signals.push({name:'RSI',val:'偏强',sig:'sell'});
  else if(rsi6[last]<30)signals.push({name:'RSI',val:'偏弱',sig:'buy'});
  else signals.push({name:'RSI',val:'中性('+rsi6[last].toFixed(1)+')',sig:'neutral'});
  var br=calcBOLL(closes,20,2);
  if(closes[last]>br.upper[last])signals.push({name:'BOLL',val:'突破上轨',sig:'sell'});
  else if(closes[last]<br.lower[last])signals.push({name:'BOLL',val:'跌破下轨',sig:'buy'});
  else signals.push({name:'BOLL',val:'中轨附近',sig:'neutral'});
  var el=document.getElementById('techSignals');
  if(el){
    var sigMap={buy:{bg:'#fff2f0',color:'#ff4d4f',text:'看多'},sell:{bg:'#f6ffed',color:'#52c41a',text:'看空'},neutral:{bg:'#f5f5f5',color:'#999',text:'中性'}};
    el.innerHTML=signals.map(s=>{var m=sigMap[s.sig];return '<div style="background:'+m.bg+';border-radius:8px;padding:14px 16px;border:1px solid #f0f0f0"><div style="font-size:12px;color:#999;margin-bottom:6px">'+s.name+'</div><div style="font-size:20px;font-weight:700;margin-bottom:4px">'+s.val+'</div><div style="font-size:12px;padding:2px 8px;border-radius:10px;display:inline-block;color:'+m.color+'">'+m.text+'</div></div>';}).join('');
  }
  var vd=document.getElementById('techVerdict');
  if(vd){
    var buys=signals.filter(s=>s.sig==='buy').length,sells=signals.filter(s=>s.sig==='sell').length;
    var verdict=buys>sells?'短期偏多':sells>buys?'短期偏空':'多空平衡';
    var vcolor=buys>sells?'#ff4d4f':sells>buys?'#52c41a':'#999';
    vd.innerHTML='<b style="color:#333">综合判定：</b><span style="color:'+vcolor+';font-weight:700">'+verdict+'</span>。'+signals.map(s=>s.name+s.val).join('，')+'。';
  }
}

  el.innerHTML='<div class="empty">加载赛道热度...</div>';
  try{
    var d=await apiV('/api/proxy/tracks/heat/latest');
    if(d&&d.length){
      var html='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">';
      d.slice(0,10).forEach(function(t){
        var name=t.name||'--';
        var score=t.score!=null?t.score:'-';
        var change=t.change||0;
        var color=change>0?'#ff4d4f':change<0?'#52c41a':'#999';
        var arrow=change>0?'↑':change<0?'↓':'—';
        var newsC=t.news_count||0;
        var policyC=t.policy_count||0;
        html+='<div class="card" style="cursor:pointer;padding:16px" onclick="goPage(&#39;track&#39;)"><div style="font-size:15px;font-weight:600;margin-bottom:4px">'+name+'</div><div style="display:flex;align-items:baseline;gap:12px"><span style="font-size:28px;font-weight:700;color:#1890ff">'+score+'</span><span style="font-size:16px;font-weight:600;color:'+color+'">'+arrow+' '+Math.abs(change).toFixed(1)+'</span></div><div style="font-size:12px;color:#999;margin-top:6px">资讯 '+newsC+' · 政策 '+policyC+'</div></div>';
      });
      html+='</div>';
      el.innerHTML=html;
    }else{
      el.innerHTML='<div class="empty">暂无赛道数据</div>';
    }
  }catch(e){
    el.innerHTML='<div class="empty">加载失败: '+e.message+'</div>';
  }
}

function btSelectPreset(idx){
  document.querySelectorAll('.bt-preset').forEach((el,i)=>el.classList.toggle('active',el.dataset.idx==idx));
  if(idx>=0 && window._btPresets && window._btPresets[idx]){
    const p = window._btPresets[idx];
    const c = p.config || {};
    document.getElementById('btName').value = p.name;
    document.getElementById('btSL').value = (c.stop_loss_pct||0)*100;
    document.getElementById('btTP').value = (c.take_profit_pct||0)*100;
    document.getElementById('btHold').value = c.max_holding_days||20;
    document.getElementById('btBench').value = c.benchmark||'000300';
    document.getElementById('btLogic').value = c.signal_logic||'AND';
    document.getElementById('btMaxPos').value = c.max_positions||10;
    document.getElementById('btPosPct').value = (c.position_size_pct||0.1)*100;
  }
}

async function btRun(){
  const btn = document.getElementById('btRunBtn');
  const loading = document.getElementById('btLoading');
  const result = document.getElementById('btResult');
  btn.disabled=true;btn.textContent='计算中...';
  loading.style.display='block';result.classList.remove('show');

  // Build conditions from preset or custom
  const presetIdx = Array.from(document.querySelectorAll('.bt-preset')).findIndex(el=>el.classList.contains('active'));
  let entryConditions = [];
  let exitConditions = [];
  let scoringThreshold = null;

  if(presetIdx>0 && window._btPresets[presetIdx-1]){
    const p = window._btPresets[presetIdx-1];
    entryConditions = p.config.entry_conditions || [];
    exitConditions = p.config.exit_conditions || [];
    scoringThreshold = p.config.scoring_threshold;
  } else {
    // Custom: use RSI bottom as default
    entryConditions = [
      {indicator:"rsi_6",operator:"<",value:30},
      {indicator:"kdj_k",operator:"<",value:20}
    ];
    exitConditions = [{indicator:"rsi_6",operator:">",value:70}];
  }

  const body = {
    name: document.getElementById('btName').value,
    start_date: document.getElementById('btStart').value,
    end_date: document.getElementById('btEnd').value,
    initial_capital: parseInt(document.getElementById('btCapital').value),
    max_positions: parseInt(document.getElementById('btMaxPos').value),
    position_size_pct: parseInt(document.getElementById('btPosPct').value)/100,
    entry_conditions: entryConditions,
    exit_conditions: exitConditions,
    signal_logic: document.getElementById('btLogic').value,
    scoring_threshold: scoringThreshold,
    stop_loss_pct: parseInt(document.getElementById('btSL').value)/100,
    take_profit_pct: parseInt(document.getElementById('btTP').value)/100,
    max_holding_days: parseInt(document.getElementById('btHold').value),
    benchmark: document.getElementById('btBench').value
  };

  try{
    const data = await api('/api/backtest/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!data.success){toast(data.error||'回测失败',true);return}
    btRenderResult(data.data);
  }catch(e){toast(e.message,true)}
  finally{btn.disabled=false;btn.textContent='▶ 开始回测';loading.style.display='none';result.classList.add('show');setTimeout(()=>{if(window._btChart)window._btChart.resize()},50)}
}

function btRenderResult(d){
  const s = d.stats||{};
  const fmtPct = v=>(v==null?'-':(v*100).toFixed(2)+'%');
  const fmtNum = v=>(v==null?'-':v.toLocaleString());

  // Stats cards
  document.getElementById('btStats').innerHTML = `
    <div class="bt-stat ${s.total_return>=0?'green':'red'}"><div class="v">${fmtPct(s.total_return)}</div><div class="l">策略总收益</div></div>
    <div class="bt-stat ${s.excess_return!=null?(s.excess_return>=0?'green':'red'):'blue'}"><div class="v">${fmtPct(s.excess_return)}</div><div class="l">超额收益</div></div>
    <div class="bt-stat blue"><div class="v">${fmtPct(s.max_drawdown)}</div><div class="l">最大回撤</div></div>
    <div class="bt-stat gold"><div class="v">${fmtPct(s.win_rate)}</div><div class="l">胜率 (${s.total_trades}笔)</div></div>
  `;

  // VS comparison
  const bmReturn = s.benchmark_return;
  const hasBm = bmReturn!=null;
  document.getElementById('btVs').innerHTML = hasBm ? `
    <div class="bt-vs-card">
      <h4>📊 策略 vs ${esc(d.benchmark_name||d.benchmark||'基准')}</h4>
      <div class="bt-vs-row"><span class="k">策略总收益</span><b style="color:${s.total_return>=0?'#52c41a':'#ff4d4f'}">${fmtPct(s.total_return)}</b></div>
      <div class="bt-vs-row"><span class="k">基准总收益</span><b>${fmtPct(bmReturn)}</b></div>
      <div class="bt-vs-row"><span class="k">策略年化</span><b>${fmtPct(s.annualized_return)}</b></div>
      <div class="bt-vs-row"><span class="k">基准年化</span><b>${fmtPct(s.benchmark_annualized)}</b></div>
      <div class="bt-vs-row"><span class="k">Alpha</span><b>${s.alpha!=null?s.alpha.toFixed(4):'-'}</b></div>
      <div class="bt-vs-row"><span class="k">Beta</span><b>${s.beta!=null?s.beta.toFixed(4):'-'}</b></div>
      <div class="bt-vs-row"><span class="k">信息比率</span><b>${s.information_ratio!=null?s.information_ratio.toFixed(2):'-'}</b></div>
    </div>
    <div class="bt-vs-card">
      <h4>📉 风险对比</h4>
      <div class="bt-vs-row"><span class="k">策略最大回撤</span><b style="color:#ff4d4f">${fmtPct(s.max_drawdown)}</b></div>
      <div class="bt-vs-row"><span class="k">基准最大回撤</span><b>${fmtPct(s.benchmark_max_drawdown)}</b></div>
      <div class="bt-vs-row"><span class="k">Sharpe</span><b>${s.sharpe_ratio!=null?s.sharpe_ratio.toFixed(2):'-'}</b></div>
      <div class="bt-vs-row"><span class="k">笔均盈亏</span><b>${fmtNum(s.avg_pnl_per_trade)}</b></div>
      <div class="bt-vs-row"><span class="k">平均持仓</span><b>${s.avg_holding_days||'-'}天</b></div>
      <div class="bt-vs-row"><span class="k">交易天数</span><b>${s.trade_dates||'-'}天</b></div>
    </div>
  ` : '';

  // Chart
  const curve = (d.equity_curve_sample||[]);
  const bmCurve = (d.benchmark_curve_sample||[]);
  if(window._btChart){window._btChart.dispose();window._btChart=null}
  const chartDom = document.getElementById('btChart');
  if(chartDom && curve.length>0){
    window._btChart = echarts.init(chartDom);
    const dates = curve.map(p=>p.date);
    const series = [{name:'策略权益',type:'line',data:curve.map(p=>p.equity),smooth:true,lineStyle:{width:2},itemStyle:{color:'#1890ff'}}];
    if(bmCurve.length>0) series.push({name:(d.benchmark_name||'基准')+'权益',type:'line',data:bmCurve.map(p=>p.benchmark_equity),smooth:true,lineStyle:{width:2,type:'dashed'},itemStyle:{color:'#faad14'}});
    window._btChart.setOption({tooltip:{trigger:'axis'},legend:{data:series.map(s=>s.name)},grid:{left:'3%',right:'4%',bottom:'3%',containLabel:true},xAxis:{type:'category',data:dates,axisLabel:{fontSize:10,rotate:30}},yAxis:{type:'value',axisLabel:{formatter:v=>(v/10000).toFixed(0)+'万'}},series});
    window.addEventListener('resize',()=>window._btChart&&window._btChart.resize());
  }

  // Trades table
  const trades = (d.trades||[]).filter(t=>t.action==='sell');
  document.getElementById('btTradeCount').textContent = `共 ${d.total_trades} 笔交易（买入+卖出），盈利 ${s.win_trades} 笔，亏损 ${s.lose_trades} 笔`;
  if(trades.length===0){document.getElementById('btTradeTable').innerHTML='<div class="empty">无交易记录</div>';return}
  document.getElementById('btTradeTable').innerHTML = `<table class="et"><thead><tr><th>日期</th><th>股票</th><th>买入价</th><th>卖出价</th><th>盈亏</th><th>收益率</th><th>持仓天数</th><th>原因</th></tr></thead><tbody>${trades.slice(0,50).map(t=>'<tr><td>'+t.date+'</td><td>'+t.stock_code+'</td><td>'+t.price.toFixed(2)+'</td><td>'+(t.pnl>=0?'<span style="color:#52c41a">+'+t.pnl.toFixed(0)+'</span>':'<span style="color:#ff4d4f">'+t.pnl.toFixed(0)+'</span>')+'</td><td>'+(t.pnl_pct>=0?'+':'')+(t.pnl_pct*100).toFixed(1)+'%</td><td>'+t.holding_days+'</td><td>'+esc(t.reason||'')+'</td></tr>').join('')}</tbody></table>`;
}

if(S.source)params.set('source',S.source);
if(S.industry)params.set('industry',S.industry);
try{
const data=await api('/api/investment/events?'+params);
const items=data.items||data||[];
const total=data.total||items.length;
const el=document.getElementById('invList');
if(!items.length){el.innerHTML='<div class="empty">暂无数据，尝试调整筛选条件</div>';document.getElementById('invPager').innerHTML='';return;}

function alertRenderList(items){

<div class="acts">${a.is_read?'':'<a onclick="alertMarkRead('+a.id+')">标记已读</a>'}</div>

function alertRenderRules(rules){
