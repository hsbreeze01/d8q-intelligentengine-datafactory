      rh += '<div style="background:#f6ffed;padding:10px;border-radius:8px;text-align:center"><div style="font-size:11px;color:#999">总信号</div><b style="font-size:18px">'+rv.total+'</b></div>';
      rh += '<div style="background:'+(rv.win_rate>=50?'#f6ffed':'#fff2f0')+';padding:10px;border-radius:8px;text-align:center"><div style="font-size:11px;color:#999">胜率</div><b style="font-size:18px;color:'+(rv.win_rate>=50?'#52c41a':'#f5222d')+'">'+rv.win_rate+'%</b></div>';
      rh += '<div style="background:#e6f7ff;padding:10px;border-radius:8px;text-align:center"><div style="font-size:11px;color:#999">盈亏比</div><b style="font-size:18px">'+rv.profit_loss_ratio+'</b></div>';
      rh += '<div style="background:#fff7e6;padding:10px;border-radius:8px;text-align:center"><div style="font-size:11px;color:#999">平均持仓</div><b style="font-size:18px">'+rv.avg_hold_days+'天</b></div>';
      rh += '<div style="background:#f9f0ff;padding:10px;border-radius:8px;text-align:center"><div style="font-size:11px;color:#999">出场分布</div><b style="font-size:12px">止损'+(rv.exit_reasons?rv.exit_reasons.stop_loss:0)+'/达标'+(rv.exit_reasons?rv.exit_reasons.target_hit:0)+'/过期'+(rv.exit_reasons?rv.exit_reasons.expired:0)+'</b></div>';
      rh += '</div>';
      if(rv.by_type){
        rh += '<div style="margin-bottom:8px"><b style="font-size:13px">按信号类型:</b></div>';
        rh += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
        var typeNames={buy1:'一买',buy2:'二买',buy3:'三买',sell1:'一卖',sell2:'二卖',sell3:'三卖'};
        Object.keys(rv.by_type).forEach(function(t){var d=rv.by_type[t];
          var color=d.avg_pnl>=0?'#52c41a':'#f5222d';
          rh+='<div style="background:#fafafa;border:1px solid #f0f0f0;padding:8px 12px;border-radius:6px;font-size:12px"><b>'+(typeNames[t]||t)+'</b> 共'+d.total+'笔 胜率<span style="color:'+color+'">'+d.win_rate+'%</span> 均盈<span style="color:'+color+'">'+d.avg_pnl+'%</span></div>';
        });
        rh += '</div>';
      }
      if(rv.by_board){
        rh += '<div style="margin-bottom:8px"><b style="font-size:13px">按板块:</b></div>';
        rh += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
        var boardNames={main:'主板',gem:'创业板',star:'科创板',bse:'北交所'};
        Object.keys(rv.by_board).forEach(function(b){var d=rv.by_board[b];
          rh+='<div style="background:#fafafa;border:1px solid #f0f0f0;padding:8px 12px;border-radius:6px;font-size:12px"><b>'+(boardNames[b]||b)+'</b> '+d.total+'笔 胜率'+d.win_rate+'% 均盈'+d.avg_pnl+'%</div>';
        });
        rh += '</div>';
      }
      rh += '<div style="font-size:11px;color:#bbb;margin-top:8px">更新: '+(rv.generated_at||'-')+' · 每日16:00自动回填 · 持仓上限10天</div>';
    }
    rEl.innerHTML = rh;
  }catch(e){var rEl2=document.getElementById("czscReviewSection");if(rEl2)rEl2.innerHTML='<div style="padding:12px;color:#f5222d;font-size:13px">复盘加载失败: '+e.message+'</div>'} }, 500);

}


// czsc 信号详情（K线+笔+中枢 ECharts 可视化）
async function czscShowDetail(code, name){
  var panel = document.getElementById('drawerPanel');
  var overlay = document.getElementById('drawerOverlay');
  var title = document.getElementById('drawerTitle');
  var body = document.getElementById('drawerBody');
  if(!panel||!body) return;

  panel.classList.add('open');
  if(overlay) overlay.classList.add('open');
  title.textContent = (name||code) + ' \u7f20\u8bba\u7ed3\u6784';
  body.innerHTML = '<div style="padding:40px;text-align:center;color:#999">\u52a0\u8f7d\u4e2d...</div>';

  var data = await apiV('/api/chanlun/czsc/' + code);
  if(!data||data.error||!data.klines||!data.klines.length){
    body.innerHTML='<div style="padding:20px;color:#f5222d">\u52a0\u8f7d\u5931\u8d25: '+(data&&data.error?data.error:'\u65e0\u6570\u636e')+'</div>';
    return;
  }

  var trendMap={up_trend:'\u4e0a\u6da8\u8d8b\u52bf',down_trend:'\u4e0b\u8dcc\u8d8b\u52bf',consolidation:'\u9707\u8361\u6574\u7406'};
  var h='<div style="padding:12px">';
  h+='<div style="display:flex;gap:16px;font-size:13px;margin-bottom:10px;color:#555;flex-wrap:wrap">';
  h+='<span>\u7b14: <b>'+data.bi_count+'</b></span>';
  h+='<span>\u4e2d\u67a2: <b>'+data.zs_count+'</b></span>';
  h+='<span>\u8d8b\u52bf: <b>'+(trendMap[data.trend]||data.trend||'-')+'</b></span>';
  h+='<span>\u80cc\u9a70: '+(data.divergence&&data.divergence.is_divergence?'<b style="color:#f5222d">\u6709</b>':'<b>\u65e0</b>')+'</span>';
  h+='<span>K\u7ebf: <b>'+data.klines.length+'</b>\u6839</span>';
  h+='</div>';
  h+='<div id="czscDetailChart" style="height:360px;width:100%;border:1px solid #eee;border-radius:8px"></div>';

  var signals=(data.buys||[]).concat(data.sells||[]);
  if(signals.length){
    h+='<div style="margin-top:10px;font-size:12px"><b>\u5f53\u524d\u4fe1\u53f7:</b> ';
    signals.forEach(function(sig){
      var c=sig.type.startsWith('buy')?'#52c41a':'#f5222d';
      h+='<span style="color:'+c+';margin-right:10px;font-weight:500">'+sig.type+' '+(sig.price?sig.price.toFixed(2):'')+' ('+sig.reason+')</span>';
    });
    h+='</div>';
  }
  if(data.zs&&data.zs.length){
    h+='<div style="margin-top:8px;font-size:12px;color:#666"><b>\u4e2d\u67a2:</b> ';
    data.zs.forEach(function(z,i){
      h+='<span style="margin-right:10px;background:#e6f7ff;padding:2px 8px;border-radius:4px;font-size:11px">ZS'+(i+1)+' ['+z.zd+'~'+z.zg+'] '+z.sdt.substring(5)+'\u2192'+z.edt.substring(5)+'</span>';
    });
    h+='</div>';
  }
  h+='</div>';
  body.innerHTML=h;

  setTimeout(function(){
    var dom=document.getElementById('czscDetailChart');
    if(!dom)return;
    var chart=echarts.init(dom);_registerChart(chart);
    var dates=data.klines.map(function(k){return k.dt.substring(0,10);});
    var ohlc=data.klines.map(function(k){return[k.open,k.close,k.low,k.high];});
    var vols=data.klines.map(function(k){return k.volume/10000;});
    var zsAreas=(data.zs||[]).map(function(z){return[{xAxis:z.sdt.substring(0,10),yAxis:z.zd},{xAxis:z.edt.substring(0,10),yAxis:z.zg}];});
    var biLines=(data.bis||[]).map(function(b){var sv=b.dir==='up'?b.low:b.high;var ev=b.dir==='up'?b.high:b.low;return[{coord:[b.sdt.substring(0,10),sv]},{coord:[b.edt.substring(0,10),ev]}];});
    var marks=signals.map(function(sig){var ib=sig.type.startsWith('buy');return{name:sig.type,coord:[sig.dt.substring(0,10),sig.price],value:sig.type,symbolRotate:ib?0:180,itemStyle:{color:ib?'#52c41a':'#f5222d'}};});
    chart.setOption({
      animation:false,tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
      grid:[{left:55,right:15,top:25,height:'60%'},{left:55,right:15,top:'76%',height:'16%'}],
      xAxis:[{type:'category',data:dates,gridIndex:0,axisLabel:{fontSize:9,rotate:45}},{type:'category',data:dates,gridIndex:1,show:false}],
      yAxis:[{type:'value',gridIndex:0,scale:true,splitLine:{lineStyle:{type:'dashed',color:'#f0f0f0'}}},{type:'value',gridIndex:1,scale:true,show:false}],
      dataZoom:[{type:'inside',xAxisIndex:[0,1],start:50,end:100}],
      series:[
        {name:'K\u7ebf',type:'candlestick',data:ohlc,xAxisIndex:0,yAxisIndex:0,
         itemStyle:{color:'#f5222d',color0:'#52c41a',borderColor:'#f5222d',borderColor0:'#52c41a'},
         markArea:{silent:true,itemStyle:{color:'rgba(24,144,255,0.08)',borderWidth:1,borderColor:'rgba(24,144,255,0.3)',borderType:'dashed'},data:zsAreas,label:{show:true,position:'insideTop',formatter:'\u4e2d\u67a2',fontSize:10,color:'#1890ff'}},
         markLine:{silent:true,symbol:['circle','arrow'],symbolSize:[3,5],lineStyle:{color:'#fa8c16',width:1.5},data:biLines,label:{show:false}},
         markPoint:{symbol:'pin',symbolSize:28,data:marks,label:{show:true,formatter:function(p){return p.data.value;},fontSize:9,color:'#fff'}}
        },
        {name:'\u6210\u4ea4\u91cf(\u4e07)',type:'bar',data:vols,xAxisIndex:1,yAxisIndex:1,itemStyle:{color:'rgba(0,0,0,0.1)'},barMaxWidth:3}
      ]
    });
  },200);
}


function resetCzscHistoryDates() {
  var end = new Date();
  var start = new Date();
  start.setDate(start.getDate() - 1);
  var s = document.getElementById('czscHistoryStartDate');
  var e = document.getElementById('czscHistoryEndDate');
  if(s) s.value = fmtDate(start);
  if(e) e.value = fmtDate(end);
  loadCzscHistory();
}

function fmtDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function loadCzscHistory() {
  var sd = document.getElementById('czscHistoryStartDate').value;
  var ed = document.getElementById('czscHistoryEndDate').value;
  var st = document.getElementById('czscHistoryStatus');
  var rs = document.getElementById('czscHistoryResults');
  if(!sd||!ed){st.innerHTML='<span style="color:#f5222d">\u8bf7\u9009\u62e9\u65e5\u671f</span>';return;}
  st.innerHTML='\u52a0\u8f7d\u4e2d...';
  rs.innerHTML='<div style="text-align:center;padding:40px;color:#999">\u52a0\u8f7d\u4e2d...</div>';
  try {
    var resp = await fetch('/api/chanlun/czsc/history?start_date='+sd+'&end_date='+ed+'&limit=500');
    var data = await resp.json();
    if(data.error){st.innerHTML='<span style="color:#f5222d">\u67e5\u8be2\u5931\u8d25</span>';return;}
    st.innerHTML='\u627e\u5230 '+data.count+' \u6761\u4fe1\u53f7';
    if(!data.signals||!data.signals.length){rs.innerHTML='<div style="text-align:center;padding:40px;color:#666">\u65e0\u4fe1\u53f7\u6570\u636e</div>';return;}
    var typeMap={buy1:'\u4e00\u4e70',buy2:'\u4e8c\u4e70',buy3:'\u4e09\u4e70',sell1:'\u4e00\u5356',sell2:'\u4e8c\u5356',sell3:'\u4e09\u5356'};
    var reasonMap={'trend_bottom_divergence':'\u4e0b\u8dcc\u8d8b\u52bf\u5e95\u90e8\u80cc\u9a70\uff0c\u52a8\u80fd\u8870\u7aed\u53cd\u8f6c\u4fe1\u53f7','trend_top_divergence':'\u4e0a\u6da8\u8d8b\u52bf\u9876\u90e8\u80cc\u9a70\uff0c\u52a8\u80fd\u8870\u7aed\u89c1\u9876\u4fe1\u53f7','consolidation_bottom_divergence':'\u9707\u8361\u533a\u95f4\u5e95\u90e8\u80cc\u9a70\uff0c\u53cd\u5f39\u6982\u7387\u5927','consolidation_top_divergence':'\u9707\u8361\u533a\u95f4\u9876\u90e8\u80cc\u9a70\uff0c\u56de\u843d\u6982\u7387\u5927','pullback_not_break_low':'\u56de\u8c03\u672a\u521b\u65b0\u4f4e\uff0c\u5e95\u90e8\u7ed3\u6784\u786e\u8ba4','breakout_pullback_above_zg':'\u7a81\u7834\u4e2d\u67a2\u540e\u56de\u8e29\uff0c\u7ad9\u7a33\u4e0a\u6cbf','rebound_not_break_high':'\u53cd\u5f39\u65e0\u529b\uff0c\u672a\u80fd\u7a81\u7834\u524d\u9ad8','breakdown_rebound_below_zd':'\u8dcc\u7834\u4e0b\u6cbf\u540e\u53cd\u62bd\u65e0\u529b'};
    var trendMap={up_trend:'\u4e0a\u6da8\u8d8b\u52bf',down_trend:'\u4e0b\u8dcc\u8d8b\u52bf',consolidation:'\u9707\u8361\u6574\u7406'};
    var html='';
    data.signals.forEach(function(s){
      var sc=s.score||0;
      var isBuy=s.type&&s.type.indexOf('buy')===0;
      var accent=isBuy?'#52c41a':'#f5222d';
      var tn=typeMap[s.type]||s.type||'-';
      var dt=s.signal_date;if(typeof dt==='string'&&dt.includes(','))dt=dt.substring(5,16).replace(',','');
      var slp=s.price&&s.stop_loss?((parseFloat(s.price)-parseFloat(s.stop_loss))/parseFloat(s.price)*100).toFixed(1):'5';
      var eLo=s.entry_price?(parseFloat(s.entry_price)*0.97).toFixed(2):(parseFloat(s.price)*0.97).toFixed(2);
      var eHi=s.entry_price?(parseFloat(s.entry_price)*1.03).toFixed(2):(parseFloat(s.price)*1.03).toFixed(2);
      var rt=reasonMap[s.reason]||s.reason||'';
      html+='<div style="border:1px solid #f0f0f0;border-left:4px solid '+accent+';border-radius:10px;padding:14px 18px;margin-bottom:10px;background:#fcfff8">';
      html+='<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">';
      html+='<span style="font-size:15px;font-weight:700;color:#1890ff;cursor:pointer" onclick="czscShowDetail(\''+s.code+'\',\''+(s.name||'')+'\')">'+s.code+'</span>';
      html+='<span style="font-size:11px;color:#52c41a;border:1px solid #52c41a;padding:0 4px;border-radius:3px">'+dt+'</span>';
      html+='<span style="font-size:14px;color:#333">'+(s.name||'')+'</span>';
      html+='<span style="background:'+accent+';color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500">'+tn+'</span>';
      html+='<span style="font-size:11px;color:#fa8c16;font-weight:600;border:1px solid #fa8c16;padding:1px 6px;border-radius:8px;margin-left:4px">'+sc+'\u5206</span>';
      html+='</div>';
      html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px;font-size:12px;color:#555;padding:8px 10px;background:rgba(255,255,255,0.8);border-radius:6px;margin-bottom:8px">';
      html+='<div>\u5efa\u8bae\u4e70\u5165 <b>'+eLo+'</b></div>';
      html+='<div>\u53ef\u4e70\u533a\u95f4 <b>'+eLo+'~'+eHi+'</b></div>';
      html+='<div>\u4fe1\u53f7\u4ef7 <b>'+s.price+'</b></div>';
      html+='<div>\u6b62\u635f <b>'+s.stop_loss+'</b> ('+slp+'%)</div>';
      html+='<div>\u8d8b\u52bf '+(trendMap[s.trend_type]||s.trend_type||'-')+'</div>';
      html+='</div>';
      html+='<div style="font-size:13px;color:#333;padding:8px 12px;background:#f6ffed;border-radius:6px;border:1px solid #b7eb8f">';
      html+='<b>\ud83c\udfaf \u64cd\u4f5c:</b> \u4e0b\u4e00\u4ea4\u6613\u65e5\u5f00\u76d8\u786e\u8ba4\u4ef7\u683c\u5728'+eLo+'~'+eHi+'\u533a\u95f4\u5185\u4e70\u5165\uff0c\u4ed3\u4f4d20%';
      if(rt) html+='<br><b style="color:#666">\u4fe1\u53f7\u7406\u7531:</b> '+rt;
      html+='</div>';
      html+='</div>';
    });
    rs.innerHTML=html;
    if(!document.getElementById('czscHistoryStartDate').value)resetCzscHistoryDates();
  } catch(e) {
    st.innerHTML='<span style="color:#f5222d">\u7f51\u7edc\u9519\u8bef</span>';
  }
}

window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    if(document.getElementById('czscHistoryStartDate'))resetCzscHistoryDates();
  },1000);
});


async function loadMacro(el){
  var data = await apiV("/api/macro/sentiment?days=250");
  var latest = data.latest||{}, hist = data.history||[];
  if(!hist.length){el.innerHTML='<div style="padding:40px;text-align:center;color:#999">暂无情绪数据</div>';return;}

  var PHASE={
    '冰点':{c:'#1890ff',tip:'连板高度压缩、亏钱效应弥漫。冰点末期小仓试错，不恐慌割肉'},
    '修复':{c:'#52c41a',tip:'涨停回升、龙头先走。做主线龙头，分歧转一致'},
    '温和':{c:'#faad14',tip:'趋势运行、持仓观望。模式内正常参与'},
    '亢奋':{c:'#fa8c16',tip:'涨停潮、连板高度抬升。高潮次日规避后排跟风'},
    '过热':{c:'#f5222d',tip:'人人皆赚、缩量一字。持股不开仓，命好就锁命不好赶紧跑'}
  };
  function phaseOf(v){return v>=80?'过热':v>=60?'亢奋':v>=40?'温和':v>=20?'修复':'冰点';}
  var ph=latest.phase||phaseOf(latest.composite||0);
  var PC=PHASE[ph]||PHASE['温和'];
  function fmt(v,d){return (v===null||v===undefined||isNaN(v))?'-':Number(v).toFixed(d===undefined?1:d);}
  function pct(v){return (v===null||v===undefined||isNaN(v))?'-':(Number(v)*100).toFixed(1)+'%';}
  function yi(v){return (v===null||v===undefined||isNaN(v))?'-':(Number(v)/1e8).toFixed(0);}
  var sd=latest.streak_dist||{};

  var h='<div style="max-width:1100px;margin:0 auto;padding:20px 16px">';
  h+='<div style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
  h+='<h3 style="margin:0;font-size:22px;font-weight:700">🌐 宏观仪表盘</h3>';
  h+='<span style="font-size:11px;color:#aaa">板块 1/1 · 市场情绪</span></div>';

  h+='<div class="macro-section" id="sec-sentiment" style="background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:18px;margin-bottom:16px">';
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">';
  h+='<h4 style="margin:0;font-size:16px;font-weight:700">📈 市场情绪温度计</h4>';
  h+='<span style="background:'+PC.c+';color:#fff;font-weight:700;font-size:13px;padding:3px 12px;border-radius:12px">'+ph+' '+fmt(latest.composite)+'</span>';
  h+='<span style="font-size:12px;color:#999">截至 '+latest.date+'</span>';
  h+='<span style="font-size:11px;color:#888;margin-left:auto;max-width:420px">'+PC.tip+'</span></div>';

  var cards=[
    ['涨停 / 跌停',(latest.limit_up||0)+' / '+(latest.limit_down||0), '触及涨停 '+(latest.touch_limit||0)],
    ['封板率', pct(latest.seal_rate), '收盘封板 / 盘中触板'],
    ['连板高度', (latest.max_streak||'-')+' 板', '首板 '+(sd['1']||0)+' · 2板 '+(sd['2']||0)+' · 3板 '+(sd['3']||0)+' · 4板+ '+(sd['4+']||0)],
    ['晋级率 1进2', pct(latest.promo_1_2), '2进3 '+pct(latest.promo_2_3)],
    ['昨涨停溢价', fmt(latest.premium_mean)+'%', '中位数 '+fmt(latest.premium_median)+'%'],
    ['大面 / 天地板', (latest.big_face||0)+' / '+(latest.heaven_hell||0), '昨涨停今暴跌 · 触板收跌停'],
    ['上涨占比', pct(latest.up_ratio), '全市场涨家比例'],
    ['成交额', yi(latest.total_turnover)+' 亿', '沪深合计']
  ];
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px">';
  cards.forEach(function(c){
    h+='<div style="background:#fafafa;border-radius:10px;padding:12px 14px">';
    h+='<div style="font-size:11px;color:#999;margin-bottom:4px">'+c[0]+'</div>';
    h+='<div style="font-size:20px;font-weight:700;color:#333">'+c[1]+'</div>';
    h+='<div style="font-size:11px;color:#aaa;margin-top:3px">'+c[2]+'</div></div>';
  });
  h+='</div>';
  h+='<div id="macroSentChart" style="height:340px"></div>';
  h+='<div id="macroStreakChart" style="height:230px;margin-top:8px"></div>';
  h+='</div>';
  h+='<div style="text-align:center;color:#bbb;font-size:11px;padding:8px 0 30px">后续宏观板块将追加于此（资金面 / 北向 / 估值 …）</div>';
  h+='</div>';
  el.innerHTML=h;

  ['macroSentChart','macroStreakChart'].forEach(function(id){
    var d=document.getElementById(id);
    if(d){var old=echarts.getInstanceByDom(d);if(old)old.dispose();}
  });

  var dates=hist.map(function(r){return r.date;});
  var comp=hist.map(function(r){return r.composite;});
  var ma5=hist.map(function(r){return r.composite_ma5;});
  var streak=hist.map(function(r){return r.max_streak;});
  var lu=hist.map(function(r){return r.limit_up;});
  var ld=hist.map(function(r){return r.limit_down;});

  var c1=echarts.init(document.getElementById('macroSentChart'));
  c1.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['情绪指数','5日均线'],top:0,textStyle:{fontSize:11}},
    grid:{left:40,right:16,top:30,bottom:44},
    xAxis:{type:'category',data:dates,axisLabel:{fontSize:10}},
    yAxis:{type:'value',min:0,max:100,splitNumber:5},
    dataZoom:[{type:'inside'},{type:'slider',height:16,bottom:6}],
    visualMap:{show:false,seriesIndex:0,dimension:1,pieces:[
      {lte:20,color:'#1890ff'},{gt:20,lte:40,color:'#52c41a'},{gt:40,lte:60,color:'#faad14'},
      {gt:60,lte:80,color:'#fa8c16'},{gt:80,color:'#f5222d'}]},
    series:[
      {name:'情绪指数',type:'line',data:comp,showSymbol:false,lineStyle:{width:2},areaStyle:{opacity:.08},
       markLine:{silent:true,symbol:'none',lineStyle:{type:'dashed',color:'#ccc'},label:{fontSize:9},
         data:[{yAxis:20},{yAxis:40},{yAxis:60},{yAxis:80}]}},
      {name:'5日均线',type:'line',data:ma5,showSymbol:false,lineStyle:{width:1,type:'dashed',color:'#888'}}
    ]
  });

  var c2=echarts.init(document.getElementById('macroStreakChart'));
  c2.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['连板高度','涨停家数','跌停家数'],top:0,textStyle:{fontSize:11}},
    grid:{left:36,right:36,top:30,bottom:24},
    xAxis:{type:'category',data:dates,axisLabel:{fontSize:10}},
    yAxis:[{type:'value',name:'板',minInterval:1},{type:'value',name:'家'}],
    series:[
      {name:'连板高度',type:'bar',data:streak,barMaxWidth:6,itemStyle:{color:'#fa8c16'}},
      {name:'涨停家数',type:'line',yAxisIndex:1,data:lu,showSymbol:false,lineStyle:{width:1.5,color:'#f5222d'}},
      {name:'跌停家数',type:'line',yAxisIndex:1,data:ld,showSymbol:false,lineStyle:{width:1,color:'#52c41a'}}
    ]
  });
  window._macroCharts=[c1,c2];
}

</script>
