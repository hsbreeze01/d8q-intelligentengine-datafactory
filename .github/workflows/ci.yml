name: d8q-ci
on:
  push:
    branches: [junior-assistant]
  pull_request:
    branches: [junior-assistant]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest Markdown==3.9
      - run: sudo install -d -o "lancer.zhang" -g "lancer.zhang" /var/log/d8q
      - run: pytest tests/d8q/ -q
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
